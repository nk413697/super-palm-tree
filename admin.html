
<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>KPVP Admin Panel</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="admin-container">

        <div class="admin-box">

            <h1>KPVP Admin Login</h1>
            <p>कांटा परगना विकास परिषद</p>

            <form id="adminLoginForm">

                <input
                    type="text"
                    id="username"
                    placeholder="Username"
                    required
                >

                <input
                    type="password"
                    id="password"
                    placeholder="Password"
                    required
                >

                <button type="submit">
                    Login
                </button>

                <p id="loginMessage"></p>

            </form>

        </div>

    </div>

    <script src="js/admin.js"></script>

</body>
</html>
