<!DOCTYPE html>
<html lang="hi">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>KPVP Admin Panel</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

<div class="admin-panel">

    <!-- HEADER -->

    <div class="admin-header">

        <div>
            <h1>KPVP Admin Panel</h1>
            <p>कांटा परगना विकास परिषद</p>
        </div>

        <button
            onclick="logout()"
            class="logout-btn">
            Logout
        </button>

    </div>


    <!-- DASHBOARD -->

    <div class="admin-cards">

        <div class="admin-card">

            <div class="card-icon">📸</div>

            <h3>Slider Photos</h3>

            <p id="photoCount">
                Loading...
            </p>

        </div>


        <div class="admin-card">

            <div class="card-icon">👥</div>

            <h3>Members</h3>

            <p>Coming Soon</p>

        </div>


        <div class="admin-card">

            <div class="card-icon">🏆</div>

            <h3>प्रतिभा सम्मान</h3>

            <p>Coming Soon</p>

        </div>


        <div class="admin-card">

            <div class="card-icon">📜</div>

            <h3>Certificates</h3>

            <p>Coming Soon</p>

        </div>

    </div>


    <!-- PHOTO MANAGEMENT -->

    <div class="admin-section">

        <h2>📸 Photo Management</h2>

        <p>
            Homepage Slider की photos यहाँ manage करें।
        </p>


        <!-- UPLOAD -->

        <div class="upload-box">

            <div class="upload-icon">
                📤
            </div>

            <h3>
                नई Photo Upload करें
            </h3>

            <p>
                JPG, JPEG या PNG
            </p>

            <input
                type="file"
                id="photoInput"
                accept="image/jpeg,image/png,image/jpg"
                multiple
            >

            <div
                id="previewContainer"
                class="preview-container">
            </div>

            <button
                onclick="uploadPhotos()"
                class="upload-btn">

                📤 Upload Photos

            </button>

            <p
                id="uploadMessage"
                class="upload-message">
            </p>

        </div>


        <!-- PHOTOS -->

        <div class="photo-list-section">

            <div class="photo-title-row">

                <h3>
                    🖼️ Uploaded Photos
                </h3>

                <button
                    onclick="loadPhotos()"
                    class="refresh-btn">

                    🔄 Refresh

                </button>

            </div>


            <div
                id="photoGrid"
                class="photo-grid">

            </div>

        </div>

    </div>

</div>


<script>

/* ==========================================
   GOOGLE APPS SCRIPT URL
========================================== */

const API_URL =
"https://script.google.com/macros/s/AKfycbzSsenUBVWO5OZ6yz-GDJfdSPd2-hXXcaW9YNn0I7nNqvDIjSAYw0vkxcFXWihmOmfC/exec";


/* ==========================================
   LOGIN CHECK
========================================== */

if (
    sessionStorage.getItem("kpvpAdmin")
    !== "loggedIn"
) {

    window.location.href =
        "admin.html";

}


/* ==========================================
   LOGOUT
========================================== */

function logout() {

    sessionStorage.removeItem(
        "kpvpAdmin"
    );

    window.location.href =
        "admin.html";

}


/* ==========================================
   FILE PREVIEW
========================================== */

const photoInput =
    document.getElementById(
        "photoInput"
    );


photoInput.addEventListener(
    "change",
    function () {

        const container =
            document.getElementById(
                "previewContainer"
            );

        container.innerHTML = "";


        Array.from(this.files)
            .forEach(function(file) {

                const reader =
                    new FileReader();


                reader.onload =
                    function(e) {

                        const div =
                            document.createElement(
                                "div"
                            );

                        div.className =
                            "preview-item";


                        div.innerHTML = `

                            <img
                                src="${e.target.result}"
                            >

                            <p>
                                ${file.name}
                            </p>

                        `;


                        container.appendChild(
                            div
                        );

                    };


                reader.readAsDataURL(file);

            });

    }
);


/* ==========================================
   UPLOAD PHOTOS
========================================== */

async function uploadPhotos() {

    const files =
        photoInput.files;


    const message =
        document.getElementById(
            "uploadMessage"
        );


    if (!files.length) {

        message.innerText =
            "⚠️ पहले photo select करें।";

        return;

    }


    message.innerText =
        "⏳ Uploading...";


    try {

        for (
            const file of files
        ) {

            const base64 =
                await fileToBase64(file);


            const payload = {

                action: "upload",

                fileName: file.name,

                mimeType: file.type,

                base64: base64

            };


            const response =
                await fetch(
                    API_URL,
                    {

                        method: "POST",

                        body:
                            JSON.stringify(
                                payload
                            )

                    }
                );


            const result =
                await response.json();


            if (!result.success) {

                throw new Error(
                    result.message
                );

            }

        }


        message.innerText =
            "✅ सभी photos successfully upload हो गईं।";


        photoInput.value = "";

        document.getElementById(
            "previewContainer"
        ).innerHTML = "";


        loadPhotos();


    }

    catch(error) {

        console.error(error);

        message.innerText =
            "❌ Upload failed: "
            + error.message;

    }

}


/* ==========================================
   FILE → BASE64
========================================== */

function fileToBase64(file) {

    return new Promise(
        function(resolve, reject) {

            const reader =
                new FileReader();


            reader.onload =
                function() {

                    const result =
                        reader.result;


                    const base64 =
                        result.split(",")[1];


                    resolve(base64);

                };


            reader.onerror =
                reject;


            reader.readAsDataURL(file);

        }
    );

}


/* ==========================================
   LOAD PHOTOS
========================================== */

async function loadPhotos() {

    const grid =
        document.getElementById(
            "photoGrid"
        );


    grid.innerHTML =
        "<p>⏳ Photos loading...</p>";


    try {

        const response =
            await fetch(
                API_URL
                + "?action=list"
            );


        const data =
            await response.json();


        if (!data.success) {

            throw new Error(
                data.message
            );

        }


        const photos =
            data.photos;


        document.getElementById(
            "photoCount"
        ).innerText =
            photos.length
            + " Photos";


        grid.innerHTML = "";


        if (!photos.length) {

            grid.innerHTML =
                "<p>कोई photo नहीं है।</p>";

            return;

        }


        photos.forEach(
            function(photo) {

                const card =
                    document.createElement(
                        "div"
                    );


                card.className =
                    "photo-card";


                card.innerHTML = `

                    <img
                        src="${photo.url}"
                        alt="${photo.name}"
                    >

                    <div class="photo-info">

                        <span>
                            ${photo.name}
                        </span>

                        <button
                            class="delete-btn"
                            onclick="deletePhoto('${photo.id}')">

                            🗑 Delete

                        </button>

                    </div>

                `;


                grid.appendChild(
                    card
                );

            }
        );

    }

    catch(error) {

        console.error(error);

        grid.innerHTML =
            "<p>❌ Photos load नहीं हुईं।</p>";

    }

}


/* ==========================================
   DELETE PHOTO
========================================== */

async function deletePhoto(fileId) {

    const confirmDelete =
        confirm(
            "क्या आप यह photo permanently delete करना चाहते हैं?"
        );


    if (!confirmDelete) return;


    try {

        const response =
            await fetch(
                API_URL,
                {

                    method: "POST",

                    body:
                        JSON.stringify({

                            action: "delete",

                            fileId: fileId

                        })

                }
            );


        const result =
            await response.json();


        if (!result.success) {

            throw new Error(
                result.message
            );

        }


        alert(
            "✅ Photo delete हो गई।"
        );


        loadPhotos();

    }

    catch(error) {

        alert(
            "❌ Delete failed: "
            + error.message
        );

    }

}


/* ==========================================
   LOAD ON PAGE OPEN
========================================== */

loadPhotos();

</script>

</body>

</html>
