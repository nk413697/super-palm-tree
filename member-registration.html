<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>KPVP Member Registration</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="form-container">

<h2>सदस्य पंजीकरण</h2>

<form id="memberForm">

<input type="text" id="name" placeholder="नाम" required>

<input type="text" id="father" placeholder="पिता का नाम" required>

<input type="text" id="village" placeholder="गांव" required>

<input type="text" id="gotra" placeholder="गोत्र">

<input type="text" id="mobile" placeholder="मोबाइल नंबर" required>

<input type="email" id="email" placeholder="ईमेल">

<input type="text" id="profession" placeholder="व्यवसाय">

<button type="submit">Submit</button>

</form>

<br>

<a href="index.html" class="btn">Home</a>

</div>

<script src="member.js"></script>

</body>
</html>
